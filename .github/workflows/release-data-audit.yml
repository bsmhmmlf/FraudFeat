name: Release data audit follow-up (isolated branch)
on:
  push:
    branches: [audit/release-data-20261113]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODE_SHA: faf8e0486c761db38eca9365842a818e243bc18a
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Download fixed code and original Release
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$CODE_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p audit-results
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-v1.0.0"
          curl -fsSL --retry 3 --max-time 180 "$BASE/fraudfeat-data-v1.0.0.tar.gz" -o fraudfeat-data-v1.0.0.tar.gz
          curl -fsSL --retry 3 --max-time 60 "$BASE/SHA256SUMS" -o SHA256SUMS
          sha256sum -c SHA256SUMS | tee audit-results/checksum.log
          echo '5ffff21b914c191c8dd5e2ed154869c94d0e505942e00e5068dde3e9f634f984  fraudfeat-data-v1.0.0.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('fraudfeat-data-v1.0.0.tar.gz') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'data'
                  assert member.isfile() or member.isdir()
              archive.extractall('.', filter='data')
          PY
          python3 -m venv .audit-venv
          .audit-venv/bin/python -m pip install -e ./evaluation
          echo "$PWD/.audit-venv/bin" >> "$GITHUB_PATH"
      - name: Preserve original audit log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/131803795579/logs" -o audit-results/original-audit.log
      - name: Verify every official split using pandas
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee audit-results/split-audit.log
          import itertools, json, pathlib
          import pandas as pd
          root = pathlib.Path('data')
          labels = pd.read_parquet(root / 'labels.parquet').set_index('unique_id')['label']
          assert labels.index.is_unique and labels.isin([0, 1]).all()
          result = {'code_sha': 'faf8e0486c761db38eca9365842a818e243bc18a', 'data_release': 'data-v1.0.0', 'panels': {}, 'targets': {}, 'overlaps': {}, 'errors': []}
          def check(ok, message):
              if not ok:
                  result['errors'].append(message)
          sets = {}
          for name, expected in [('offline_panel', {0: 5000, 1: 1000}), ('evaluation_panel', {0: 50000, 1: 10000})]:
              df = pd.read_parquet(root / 'splits' / (name + '.parquet'))
              ids = df['unique_id'].astype(str)
              expected_labels = labels.reindex(ids).reset_index(drop=True)
              actual_labels = df['label'].reset_index(drop=True)
              mismatches = int((expected_labels.isna() | expected_labels.ne(actual_labels)).sum())
              counts = {int(k): int(v) for k, v in actual_labels.value_counts().items()}
              sets[name] = set(ids)
              record = {'rows': len(df), 'unique_ids': len(sets[name]), 'class_counts': counts, 'label_or_membership_mismatches': mismatches}
              result['panels'][name] = record
              print('PANEL', name, json.dumps(record), flush=True)
              check(len(df) == len(sets[name]) and counts == expected and mismatches == 0, name + ' failed integrity checks')
          for seed in [42, 43, 44]:
              name = 'target_streams_s' + str(seed)
              raw = json.loads((root / 'splits' / (name + '.json')).read_text(encoding='utf-8'))
              ids = [str(x) for x in (raw.get('labels', []) if isinstance(raw, dict) else raw)]
              selected = labels.reindex(ids)
              bad = int((selected.isna() | selected.ne(1)).sum())
              sets[name] = set(ids)
              record = {'rows': len(ids), 'unique_ids': len(sets[name]), 'unknown_or_nonfraudulent': bad}
              result['targets'][name] = record
              print('TARGET', name, json.dumps(record), flush=True)
              check(len(ids) == 100 and len(sets[name]) == 100 and bad == 0, name + ' failed integrity checks')
          for a, b in itertools.combinations(sets, 2):
              overlap = len(sets[a] & sets[b])
              key = a + ' / ' + b
              result['overlaps'][key] = overlap
              print('OVERLAP', key, overlap, flush=True)
              if not (a.startswith('target_') and b.startswith('target_')):
                  check(overlap == 0, 'Forbidden overlap: ' + key)
          result['status'] = 'FAIL' if result['errors'] else 'PASS'
          pathlib.Path('audit-results/split-summary.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print('SPLIT_AUDIT', json.dumps(result), flush=True)
          raise SystemExit(bool(result['errors']))
          PY
      - name: Reproduce SQL example IV outputs
        run: |
          set -o pipefail
          /usr/bin/time -v timeout 180s python -m fraudfeat.sql_effectiveness --data data --features evaluation/examples/features.sql.example.jsonl --eval-panel data/splits/evaluation_panel.parquet --out-dir audit-results/sql --pool-limit 100 2>&1 | tee audit-results/sql.log
      - name: Profile unchanged Gremlin backend with the full released graph
        continue-on-error: true
        run: |
          set -o pipefail
          /usr/bin/time -v timeout --kill-after=5s 120s python - <<'PY' 2>&1 | tee audit-results/gremlin-profile.log
          import faulthandler, json, pathlib, time
          import pandas as pd
          from fraudfeat.graph_store import GraphStore
          from fraudfeat.pool import load_features
          from fraudfeat.gremlin_engine import execute_plan_local
          faulthandler.dump_traceback_later(35, repeat=True)
          original_read = GraphStore._read
          def traced_read(path):
              start = time.monotonic()
              print('READ_START', path, flush=True)
              value = original_read(path)
              print('READ_DONE', path, 'rows', len(value), 'seconds', round(time.monotonic()-start, 3), flush=True)
              return value
          GraphStore._read = staticmethod(traced_read)
          original_adj = GraphStore._build_adjacency
          def traced_adj(self):
              start = time.monotonic()
              print('ADJACENCY_START', flush=True)
              value = original_adj(self)
              print('ADJACENCY_DONE', round(time.monotonic()-start, 3), flush=True)
              return value
          GraphStore._build_adjacency = traced_adj
          start = time.monotonic()
          store = GraphStore('data', load_labels=False)
          load_seconds = time.monotonic() - start
          print('FULL_GRAPH_LOADED', store.summary(), 'seconds', round(load_seconds,3), flush=True)
          panel = pd.read_parquet('data/splits/evaluation_panel.parquet')
          ids = panel.groupby('label', group_keys=False).head(50)['unique_id'].astype(str).tolist()
          result = {'purpose': 'Performance probe only; not full-panel IV', 'full_graph_load_seconds': load_seconds, 'probe_accounts': len(ids), 'features': []}
          for feature in load_features('evaluation/examples/features.example.jsonl'):
              print('FEATURE_START', feature['feature_name'], flush=True)
              start = time.monotonic()
              errors = []
              for uid in ids:
                  value, trace, error = execute_plan_local(store, feature['plan'], uid, amount_unit='fen')
                  if error:
                      errors.append(str(error))
              row = {'feature': feature['feature_name'], 'accounts': len(ids), 'errors': len(errors), 'seconds': time.monotonic()-start}
              result['features'].append(row)
              print('FEATURE_DONE', json.dumps(row), flush=True)
          pathlib.Path('audit-results/gremlin-profile-summary.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          faulthandler.cancel_dump_traceback_later()
          PY
      - name: Print small result files
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          for path in sorted(pathlib.Path('audit-results').rglob('*.json')):
              print('\nRESULT_FILE', path, flush=True)
              print(path.read_text(encoding='utf-8')[:100000], flush=True)
          PY
      - name: Retain audit evidence only (no dataset or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudfeat-release-audit-evidence
          path: audit-results/
          retention-days: 7

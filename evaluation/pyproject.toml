[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudfeat"
version = "1.0.0"
description = "FraudFeat evaluation: IV, interpretability, and structural/semantic diversity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pandas>=1.3", "numpy>=1.21", "pyarrow>=8.0", "duckdb>=1.1"]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=2.2"]

[project.scripts]
fraudfeat-effectiveness = "fraudfeat.effectiveness:main"
fraudfeat-sql-effectiveness = "fraudfeat.sql_effectiveness:main"
fraudfeat-interpretability = "fraudfeat.interpretability:main"
fraudfeat-diversity = "fraudfeat.diversity:main"
fraudfeat-embedding-diversity = "fraudfeat.embedding_diversity:main"

[tool.setuptools]
packages = ["fraudfeat"]
